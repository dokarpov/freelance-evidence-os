name: Site checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Structural and motion checks
        run: python3 tests/site_check.py
      - name: Build public-only deployment directory
        run: |
          python3 scripts/build_site.py
          test -f dist/rilatu-logo.svg
          test -f dist/index.html
          test ! -e dist/.github
          test ! -e dist/tests
          ! grep -q "github.com/dokarpov/rilatu" dist/index.html
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax check
        run: node --check script.js
      - name: Install Chromium test runner
        run: |
          npm install --no-save @playwright/test@1.56.1
          npx playwright install --with-deps chromium
      - name: Responsive and interaction checks
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/rilatu-server.log 2>&1 &
          npx playwright test tests/responsive.spec.js --reporter=line --workers=2
      - name: Upload viewport screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rilatu-responsive-screenshots
          path: test-results/rilatu-*.png
          if-no-files-found: ignore
      - name: Upload website files for private-source hosting
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: rilatu-public-dist
          path: dist/
          if-no-files-found: error
